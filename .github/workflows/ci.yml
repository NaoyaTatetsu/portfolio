name: CI

on:
  pull_request:
    branches: [develop]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.9.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

      - name: Check types
        run: pnpm exec astro check

      - name: Build project
        run: pnpm run build

      # deploy.yml と同じ手順でデプロイを検証する(--dry-run なので
      # Cloudflare へのアップロードはせず、API トークンも不要)。
      # wrangler-action はここで pnpm add wrangler を実行するため、
      # allowBuilds の不足などデプロイ時だけ起きる失敗をマージ前に検出できる。
      # wranglerVersion は deploy.yml と揃える(Renovate が同じ PR で両方上げる)
      - name: Deploy dry run
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "4.147.0"
          command: deploy --dry-run

  # E2E は lint/build と独立に回す。playwright.config.ts の webServer が
  # 自前で pnpm build && pnpm preview するので、ここでのビルドは不要。
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.9.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # playwright.config.ts の projects は chromium のみ
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm run test:e2e

      # retries: 2 + trace: "on-first-retry" なので、
      # 落ちたテストのトレースが test-results/ に残る
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
